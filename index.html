      selectedModelTier = nextTier;
      selectedBackend = hasWebGPU && !isMobileDevice ? "webgpu" : "wasm";
      if (isHandsetOrTabletPlatform()) {
        releaseLlmWorker();
        releaseTtsWorker();
        if (nextTier.engine !== "lfm3-omni") {
          updateDeviceBadgeUI("probed");
          return;
        }
      }
      llmReady = false;
      llmLoadPromise = null;
      updateDeviceBadgeUI("loading", 0);
      await initLLMPreload();
      if (selectedModelTier.engine !== "lfm3-omni" && !isHandsetOrTabletPlatform()) {
        initTTSPreload();
      }
    });

    function updateCountUI() {
      countStatus.textContent = `Cards · ${selectedCardCount}`;
      countDecBtn.disabled = selectedCardCount <= 1;
      countIncBtn.disabled = selectedCardCount >= 10;
    }

    countDecBtn.addEventListener("click", () => {
      if (selectedCardCount > 1) {
        selectedCardCount -= 1;
        updateCountUI();
        if (activeSampleKey) {
          startScenario(PRECOOKED_SCENARIOS[activeSampleKey].query, activeSampleKey);
        }
      }
    });

    countIncBtn.addEventListener("click", () => {
      if (selectedCardCount < 10) {
        selectedCardCount += 1;
        updateCountUI();
        if (activeSampleKey) {
          startScenario(PRECOOKED_SCENARIOS[activeSampleKey].query, activeSampleKey);
        }
      }
    });

    updateCountUI();

    function updateRepeatUI() {
      const isInf = repeatCount === Infinity;
      repeatInfBtn.classList.toggle("active", isInf);
      const countLabel = isInf ? "∞" : `${repeatCount}×`;
      if (isPlaying && (repeatCount > 1 || isInf) && completedPasses > 0) {
        repeatStatus.textContent = isInf
          ? `Loop · Pass ${completedPasses + 1} of ∞`
          : `Loop · Pass ${completedPasses + 1} of ${repeatCount}`;
      } else {
        repeatStatus.textContent = `Repeat · ${countLabel}`;
      }
    }

    repeatDecBtn.addEventListener("click", () => {
      if (repeatCount === Infinity) {
        repeatCount = 5;
      } else {
        repeatCount = Math.max(1, repeatCount - 1);
      }
      updateRepeatUI();
    });

    repeatIncBtn.addEventListener("click", () => {
      if (repeatCount === Infinity) {
        repeatCount = 2;
      } else {
        repeatCount = Math.min(99, repeatCount + 1);
      }
      updateRepeatUI();
    });

    repeatInfBtn.addEventListener("click", () => {
      repeatCount = repeatCount === Infinity ? 1 : Infinity;
      updateRepeatUI();
    });

    function isHandsetOrTabletPlatform() {
      if (isMobileDevice) return true;
      const ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod|Android|Mobile|CriOS|FxiOS/i.test(ua)) return true;
      // iPadOS Safari desktop-mode UA reports MacIntel with multi-touch support
      if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
      return false;
    }

    function encodePcm16WavBlobUrl(samples, sampleRate = 24000) {
      const pcmBytes = samples.length * 2;
      const buffer = new ArrayBuffer(44 + pcmBytes);
      const view = new DataView(buffer);
      const writeAscii = (off, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
      };
      writeAscii(0, "RIFF");
      view.setUint32(4, 36 + pcmBytes, true);
      writeAscii(8, "WAVE");
      writeAscii(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM = 1 (universal iOS/Android hardware decoder support)
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true); // 16-bit
      writeAscii(36, "data");
      view.setUint32(40, pcmBytes, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 32768 : s * 32767, true);
      }
      return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
    }

    function getMobileAudioElement() {
      if (!mobileAudioEl) {
        mobileAudioEl = new Audio();
        mobileAudioEl.playsInline = true;
        mobileAudioEl.setAttribute("playsinline", "");
        mobileAudioEl.setAttribute("webkit-playsinline", "");
        mobileAudioEl.preload = "auto";
        mobileAudioEl.volume = 1.0;
      }
      return mobileAudioEl;
    }

    function getSilentUnlockUrl() {
      if (!silentUnlockUrl) {
        silentUnlockUrl = encodePcm16WavBlobUrl(new Float32Array(240), 24000);
      }
      return silentUnlockUrl;
    }

    function ensureAudioContext() {
      // Promote iOS 17+ Safari audio session from "ambient" (muted by Silent switch) to "playback"
      try {
        if (navigator.audioSession && navigator.audioSession.type !== "playback") {
          navigator.audioSession.type = "playback";
        }
      } catch (_) {}

      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
          // Use native hardware sample rate (48kHz/44.1kHz on mobile) — forcing {sampleRate: 24000}
          // causes silent output on several mobile WebKit / Android hardware DACs.
          audioCtx = new Ctx();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 1.35;
          masterGain.connect(audioCtx.destination);
        }
      }
      if (audioCtx && audioCtx.state !== "running") {
        audioCtx.resume().catch(() => {});
      }
    }

    function unlockAudioOnUserGesture() {
      ensureAudioContext();

      // Synchronously play 1-sample silent buffer to unlock iOS WebKit AudioContext
      if (audioCtx && audioCtx.state !== "running") {
        try {
          const silentBuf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate || 48000);
          const src = audioCtx.createBufferSource();
          src.buffer = silentBuf;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (_) {}
      }

      // Bless singleton HTML5 <audio> element inside gesture so async TTS & iPhone Silent Mode work 100%
      const el = getMobileAudioElement();
      if (!mobileAudioUnlocked && !mobileLoopRunning) {
        try {
          el.src = getSilentUnlockUrl();
          const p = el.play();
          if (p && typeof p.then === "function") {
            p.then(() => {
              mobileAudioUnlocked = true;
              if (!mobileLoopRunning) {
                el.pause();
                el.currentTime = 0;
              }
            }).catch(() => {});
          } else {
            mobileAudioUnlocked = true;
          }
        } catch (_) {}
      } else if (pendingGestureResume && mobileAudioQueue.length > 0 && !mobileLoopRunning) {
        pendingGestureResume = false;
        pumpMobileAudioQueue();
      }
    }

    // Unlock on touchend/pointerup/click/keydown (touchstart is not a valid media-activation gesture on iOS Safari)
    ["touchend", "pointerup", "click", "keydown"].forEach((evt) => {
      window.addEventListener(evt, unlockAudioOnUserGesture, { capture: true, passive: true });
    });

    function normalizeAudioSamples(samples) {
      let peak = 0;
      for (let i = 0; i < samples.length; i++) {
        const a = Math.abs(samples[i]);
        if (a > peak) peak = a;
      }
      if (peak > 0.01 && peak < 0.92) {
        const scale = 0.95 / peak;
        const out = new Float32Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
          out[i] = Math.max(-1, Math.min(1, samples[i] * scale));
        }
        return out;
      }
      return samples;
    }

    /**
     * Declarative json-render reconciler
     */
    const JSON_RENDER_COMPONENTS = {
      AffirmationCard(props, existingEl) {
        const el = existingEl || document.createElement("article");
        if (!existingEl) {
          el.className = "aff-card";
          el.dataset.cardId = String(props.id);
          const staggerMs = typeof props.id === "number" ? props.id * 65 : 0;
          el.style.setProperty("--stagger", `${staggerMs}ms`);
          el.innerHTML = `
            <span class="aff-num"></span>
            <div class="aff-body">
              <p class="aff-text"></p>
              <span class="aff-science"></span>
            </div>
            <span class="aff-badge">
              <span class="voice-bars" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="badge-label"></span>
            </span>
            <div class="aff-progress" aria-hidden="true"></div>
          `;
          el.addEventListener("click", () => {
            if (props.id === "warmup") return;
            replayFromCard(props.id);
          });
        }
        const isSpeaking = activeSpeakingId === props.id;
        const isStreaming = props.status === "streaming";
        const isLoadingVoice = !isSpeaking && !isStreaming && ttsLoadingCardId === props.id;

        if (isSpeaking && !el.classList.contains("speaking")) {
          el.style.setProperty("--speak-ms", `${activeSpeakDurationMs}ms`);
        }

        el.classList.toggle("speaking", isSpeaking);
        el.classList.toggle("streaming", (isStreaming || isLoadingVoice) && !isSpeaking);
        el.querySelector(".aff-num").textContent =
          typeof props.index === "number" ? String(props.index).padStart(2, "0") : "··";
        el.querySelector(".aff-text").textContent = props.text;
        const sciEl = el.querySelector(".aff-science");
        if (props.science) {
          sciEl.textContent = props.science;
          sciEl.style.display = "block";
        } else {
          sciEl.style.display = "none";
        }
        el.querySelector(".badge-label").textContent = isSpeaking
          ? "speaking"
          : isStreaming
          ? "streaming"
          : isLoadingVoice
          ? ttsLoadingPercent !== null
            ? `voice ${ttsLoadingPercent}%`
            : "voice..."
          : "speak";
        return el;
      },
    };

    function jsonRender(spec, container) {
      if (!spec || spec.component !== "CardStream") return;
      currentSpec = spec;
      const children = spec.children || [];

      if (children.some((c) => c.props.id !== "warmup")) {
        const warmupEl = container.querySelector('[data-card-id="warmup"]');
        if (warmupEl) warmupEl.remove();
      }

      const validIds = new Set(children.map((c) => String(c.props.id)));
      container.querySelectorAll("[data-card-id]").forEach((node) => {
        if (!validIds.has(node.dataset.cardId)) node.remove();
      });

      children.forEach((node) => {
        const fn = JSON_RENDER_COMPONENTS[node.component];
        if (!fn) return;
        const existing = container.querySelector(`[data-card-id="${node.props.id}"]`);
        const dom = fn(node.props, existing);
        if (!existing) container.appendChild(dom);
      });
    }

    function updateSpeakingHighlight(id, durationMs = 2800) {
      activeSpeakingId = id;
      activeSpeakDurationMs = durationMs;
      if (currentSpec) jsonRender(currentSpec, root);
      updateRepeatUI();
    }

    function mergeFloat32Chunks(chunks) {
      let total = 0;
      for (const c of chunks) total += c.length;
      const out = new Float32Array(total);
      let offset = 0;
      for (const c of chunks) {
        out.set(c, offset);
        offset += c.length;
      }
      return out;
    }

    function stopAllAudio() {
      // Stop Web Audio sources
      for (const src of scheduledSources) {
        try {
          src.onended = null;
          src.stop();
        } catch (_) {}
      }
      scheduledSources.clear();
      for (const timer of scheduledHighlightTimers) {
        clearTimeout(timer);
      }
      scheduledHighlightTimers.clear();

      // Stop Mobile HTML5 <audio> queue & revoke WAV blobs
      mobileAudioQueue = [];
      pendingGestureResume = false;
      if (mobileAbortWait) {
        const abortFn = mobileAbortWait;
        mobileAbortWait = null;
        abortFn();
      }
      if (mobileAudioEl) {
        try {
          mobileAudioEl.pause();
        } catch (_) {}
      }
      for (const url of activeMobileBlobUrls) {
        try {
          URL.revokeObjectURL(url);
        } catch (_) {}
      }
      activeMobileBlobUrls.clear();

      nextPlayTime = 0;
      lastScheduledCardIndex = -1;
      isPlaying = false;
      updateSpeakingHighlight(-1);
    }

    function cacheAudioChunk(index, chunk) {
      if (!cardAudioChunks.has(index)) {
        cardAudioChunks.set(index, []);
      }
      cardAudioChunks.get(index).push(chunk);
    }

    function checkAndScheduleRepeatPass() {
      if (!generationComplete || !currentSpec) return false;
      const maxPasses = repeatCount;
      if (completedPasses + 1 >= maxPasses) return false;

      const nodes = (currentSpec.children || []).filter((c) => typeof c.props.id === "number");
      if (nodes.length === 0) return false;

      let scheduledAny = false;
      completedPasses += 1;
      lastScheduledCardIndex = -1;
      if (audioCtx) {
        nextPlayTime = Math.max(audioCtx.currentTime + 0.45, nextPlayTime + 0.45);
      }

      for (const node of nodes) {
        const idx = node.props.id;
        const chunks = cardAudioChunks.get(idx);
        if (chunks && chunks.length > 0) {
          chunks.forEach((ch, cIdx) => {
            scheduledAny = true;
            enqueueAudio({
              genId: currentGenId,
              index: idx,
              text: node.props.text,
              samples: ch.samples,
              sampleRate: ch.sampleRate,
              isLastClause: cIdx === chunks.length - 1,
            });
          });
        }
      }
      return scheduledAny;
    }

    function onAudioQueueDrained() {
      const drainTimer = setTimeout(() => {
        scheduledHighlightTimers.delete(drainTimer);
        if (scheduledSources.size > 0 || mobileLoopRunning || mobileAudioQueue.length > 0) return;
        if (checkAndScheduleRepeatPass()) return;
        isPlaying = false;
        lastScheduledCardIndex = -1;
        updateSpeakingHighlight(-1);
      }, 120);
      scheduledHighlightTimers.add(drainTimer);
    }

    /**
     * Mobile-first HTML5 <audio> WAV queue.
     * Routes to iOS `AVAudioSessionCategoryPlayback` on all iOS/Android browsers so speech is
     * audible even when the physical iPhone Silent Switch is ON, and ONLY marks a card "speaking"
     * once `el.play()` actually starts hardware output.
     */
    async function pumpMobileAudioQueue() {
      if (mobileLoopRunning) return;
      mobileLoopRunning = true;
      const el = getMobileAudioElement();

      try {
        while (mobileAudioQueue.length > 0) {
          const item = mobileAudioQueue.shift();
          if (!item || (item.genId !== undefined && item.genId !== currentGenId)) {
            continue;
          }

          const sr = item.sampleRate || 24000;
          const durMs = Math.max(250, Math.round((item.samples.length / sr) * 1000));
          const blobUrl = encodePcm16WavBlobUrl(item.samples, sr);
          activeMobileBlobUrls.add(blobUrl);

          let started = false;
          try {
            el.src = blobUrl;
            el.currentTime = 0;
            await el.play();
            mobileAudioUnlocked = true;
            started = true;
          } catch (playErr) {
            URL.revokeObjectURL(blobUrl);
            activeMobileBlobUrls.delete(blobUrl);
            // If blocked waiting for gesture, keep at front of queue without faking "speaking"
            if (playErr?.name === "NotAllowedError") {
              mobileAudioQueue.unshift(item);
              pendingGestureResume = true;
              break;
            }
            continue;
          }

          if (item.genId !== undefined && item.genId !== currentGenId) {
            URL.revokeObjectURL(blobUrl);
            activeMobileBlobUrls.delete(blobUrl);
            break;
          }

          isPlaying = true;
          lastScheduledCardIndex = item.index;
          updateSpeakingHighlight(item.index, durMs);

          if (started) {
            await new Promise((resolve) => {
              let settled = false;
              const finish = () => {
                if (settled) return;
                settled = true;
                el.removeEventListener("ended", finish);
                el.removeEventListener("error", finish);
                clearTimeout(safetyTimer);
                if (mobileAbortWait === finish) mobileAbortWait = null;
                resolve();
              };
              const safetyTimer = setTimeout(finish, durMs + 1200);
              mobileAbortWait = finish;
              el.addEventListener("ended", finish, { once: true });
              el.addEventListener("error", finish, { once: true });
            });
          }

          URL.revokeObjectURL(blobUrl);
          activeMobileBlobUrls.delete(blobUrl);

          if (item.genId !== undefined && item.genId !== currentGenId) break;

          // Natural pause between clauses (55ms) or between cards (200ms)
          const nextItem = mobileAudioQueue[0];
          const pauseMs = nextItem && nextItem.index === item.index ? 55 : 200;
          await new Promise((resolve) => {
            const t = setTimeout(() => {
              scheduledHighlightTimers.delete(t);
              resolve();
            }, pauseMs);
            scheduledHighlightTimers.add(t);
          });
        }
      } finally {
        mobileLoopRunning = false;
        if (!pendingGestureResume && mobileAudioQueue.length === 0 && scheduledSources.size === 0) {
          onAudioQueueDrained();
        }
      }
    }

    /**
     * Hybrid Audio Scheduler:
     * - Mobile / iOS / Android (`!item.isStreamChunk`): plays via gesture-blessed HTML5 `<audio>`
     *   16-bit PCM WAV blobs (immune to iPhone Silent Switch & mobile WebKit sampleRate bugs).
     * - Desktop & LFM3-Omni-2B live PCM chunks (`isStreamChunk: true`): sample-accurate gapless
     *   Web Audio API playhead scheduler at native hardware sample rate.
     */
    function enqueueAudio(item) {
      if (item.genId !== undefined && item.genId !== currentGenId) return;
      if (!item.samples || item.samples.length === 0) return;

      if (isHandsetOrTabletPlatform() && !item.isStreamChunk) {
        mobileAudioQueue.push(item);
        pumpMobileAudioQueue();
        return;
      }

      ensureAudioContext();
      if (!audioCtx) {
        mobileAudioQueue.push(item);
        pumpMobileAudioQueue();
        return;
      }

      const scheduleOnRunningContext = () => {
        if (item.genId !== undefined && item.genId !== currentGenId) return;
        isPlaying = true;

        const sr = item.sampleRate || 24000;
        const now = audioCtx.currentTime;
        const isNewCard = item.index !== lastScheduledCardIndex;

        let startAt;
        if (lastScheduledCardIndex === -1) {
          startAt = Math.max(now + 0.015, nextPlayTime);
        } else if (!isNewCard) {
          // Same card: 0ms sample-accurate stitch for LFM3-Omni live PCM chunks; 55ms pause for clauses
          startAt = item.isStreamChunk
            ? Math.max(now, nextPlayTime)
            : Math.max(now, nextPlayTime + 0.055);
        } else {
          // Next card: 200ms natural breathing pause
          startAt = Math.max(now + 0.015, nextPlayTime + 0.2);
        }

        const durSec = item.samples.length / sr;
        const durMs = Math.round(durSec * 1000);
        lastScheduledCardIndex = item.index;
        nextPlayTime = startAt + durSec;

        if (isNewCard) {
          const delayMs = Math.max(0, Math.round((startAt - now) * 1000));
          const hlDuration = item.isStreamChunk ? Math.max(3400, durMs) : durMs;
          if (delayMs <= 16) {
            updateSpeakingHighlight(item.index, hlDuration);
          } else {
            const hlTimer = setTimeout(() => {
              scheduledHighlightTimers.delete(hlTimer);
              if (item.genId === undefined || item.genId === currentGenId) {
                updateSpeakingHighlight(item.index, hlDuration);
              }
            }, delayMs);
            scheduledHighlightTimers.add(hlTimer);
          }
        }

        const buf = audioCtx.createBuffer(1, item.samples.length, sr);
        buf.getChannelData(0).set(item.samples);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(masterGain || audioCtx.destination);
        scheduledSources.add(src);
        src.onended = () => {
          scheduledSources.delete(src);
          if (scheduledSources.size === 0) {
            onAudioQueueDrained();
          }
        };
        src.start(startAt);
      };

      if (audioCtx.state !== "running" && !item.isStreamChunk) {
        audioCtx
          .resume()
          .then(() => {
            if (audioCtx.state === "running") {
              scheduleOnRunningContext();
            } else {
              mobileAudioQueue.push(item);
              pumpMobileAudioQueue();
            }
          })
          .catch(() => {
            mobileAudioQueue.push(item);
            pumpMobileAudioQueue();
          });
        return;
      }

      scheduleOnRunningContext();
    }

    function parseWavArrayBuffer(arr) {
      if (arr.byteLength < 44) return null;
      const view = new DataView(arr);
      const magic =
        String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3)) +
        String.fromCharCode(view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11));
      if (magic !== "RIFFWAVE") return null;

      let fmt = 1;
      let channels = 1;
      let sampleRate = 24000;
      let bitsPerSample = 16;
      let offset = 12;

      while (offset + 8 <= arr.byteLength) {
        const chunkId = String.fromCharCode(
          view.getUint8(offset),
          view.getUint8(offset + 1),
          view.getUint8(offset + 2),
          view.getUint8(offset + 3)
        );
        const chunkSize = view.getUint32(offset + 4, true);
        const bodyOffset = offset + 8;

        if (chunkId === "fmt " && chunkSize >= 16) {
          fmt = view.getUint16(bodyOffset, true);
          channels = Math.max(1, view.getUint16(bodyOffset + 2, true));
          sampleRate = view.getUint32(bodyOffset + 4, true);
          bitsPerSample = view.getUint16(bodyOffset + 14, true);
        } else if (chunkId === "data") {
          const byteLen = Math.min(chunkSize, arr.byteLength - bodyOffset);
          if (fmt === 1 && bitsPerSample === 16) {
            const frames = Math.floor(byteLen / (2 * channels));
            const out = new Float32Array(frames);
            for (let i = 0; i < frames; i++) {
              out[i] = view.getInt16(bodyOffset + i * 2 * channels, true) / 32768;
            }
            return { samples: out, sampleRate };
          }
          if (fmt === 3 && bitsPerSample === 32) {
            const frames = Math.floor(byteLen / (4 * channels));
            const out = new Float32Array(frames);
            for (let i = 0; i < frames; i++) {
              out[i] = view.getFloat32(bodyOffset + i * 4 * channels, true);
            }
            return { samples: out, sampleRate };
          }
        }
        offset = bodyOffset + chunkSize + (chunkSize % 2);
      }
      return null;
    }

    async function loadPrebakedWav(url) {
      if (wavBufferCache.has(url)) return wavBufferCache.get(url);
      const fetchUrl = url.includes("?") ? url : `${url}?v=2`;
      const res = await fetch(fetchUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const arr = await res.arrayBuffer();

      // Fast pure-JS WAV parse preserves exact 24kHz PCM without touching mobile AudioContext
      const parsed = parseWavArrayBuffer(arr);
      if (parsed && parsed.samples.length > 0) {
        const payload = {
          samples: normalizeAudioSamples(parsed.samples),
          sampleRate: parsed.sampleRate,
        };
        wavBufferCache.set(url, payload);
        return payload;
      }

      ensureAudioContext();
      const decoded = await audioCtx.decodeAudioData(arr);
      const raw = decoded.getChannelData(0);
      const samples = normalizeAudioSamples(new Float32Array(raw));
      const payload = { samples, sampleRate: decoded.sampleRate };
      wavBufferCache.set(url, payload);
      return payload;
    }

    function splitIntoClauses(sentence) {
      const parts = sentence
        .split(/(?<=[,;—–.!?])\s+/)
        .map((s) => s.trim())
        .filter((s) => s.length > 0);
      if (parts.length <= 1) return [sentence];
      const merged = [];
      for (const p of parts) {
        if (merged.length > 0 && p.split(/\s+/).length < 3) {
          merged[merged.length - 1] += " " + p;
        } else {
          merged.push(p);
        }
      }
      return merged;
    }

    /**
     * Synthesize 24kHz speech using Liquid AI LFM3-Omni-2B in pure `"audio"` generation mode.
     * Note: LFM3-Omni speech output decodes text greedily (`do_sample` must NOT be true);
     * its internal depth decoder samples audio frames natively at 24kHz.
     */
    async function runLfm3PureTTS(text, signal = null, onChunk = null) {
      await initLLMPreload();
      if (!lfm3Session || !lfm3Model) {
        throw new Error("LFM3-Omni session unavailable");
      }
      const sr = lfm3Model.audio_sampling_rate || 24000;
      return await withLfm3TurnLock(async () => {
        const turnCtrl = new AbortController();
        lfm3TurnAbortController = turnCtrl;
        if (signal) {
          if (signal.aborted) turnCtrl.abort();
          else signal.addEventListener("abort", () => turnCtrl.abort(), { once: true });
        }
        const chunks = [];
        try {
          const stream = lfm3Session.generate(
            [
              {
                role: "system",
                content: "Perform TTS in American English using a female voice.",
              },
              { role: "user", content: text },
            ],
            {
              generation_mode: "audio",
              max_new_tokens: 240,
              signal: turnCtrl.signal,
            }
          );
          for await (const ev of stream) {
            if (ev.type === "audio" && ev.audio && ev.audio.length > 0) {
              const pcm = new Float32Array(ev.audio);
              chunks.push(pcm);
              if (onChunk) onChunk(pcm, sr);
            }
          }
        } finally {
          if (lfm3TurnAbortController === turnCtrl) {
            lfm3TurnAbortController = null;
          }
        }
        return normalizeAudioSamples(mergeFloat32Chunks(chunks));
      });
    }

    async function synthesizeAndStreamCard(genId, index, text, prebakedAudioUrl = null) {
      if (genId !== currentGenId) return;

      if (prebakedAudioUrl) {
        try {
          const { samples, sampleRate } = await loadPrebakedWav(prebakedAudioUrl);
          if (genId !== currentGenId) return;
          cacheAudioChunk(index, { samples, sampleRate });
          enqueueAudio({
            genId,
            index,
            text,
            samples,
            sampleRate,
            isLastClause: true,
          });
          return;
        } catch (_) {}
      }

      // Unified LFM3-Omni-2B WebGPU path: stream 24kHz PCM directly from the omni model
      if (selectedModelTier.engine === "lfm3-omni" && lfm3Session && !lfm3Model?.lost) {
        try {
          const sr = lfm3Model.audio_sampling_rate || 24000;
          const merged = await runLfm3PureTTS(text, null, (pcmChunk, chunkSr) => {
            if (genId !== currentGenId) return;
            enqueueAudio({
              genId,
              index,
              text,
              samples: pcmChunk,
              sampleRate: chunkSr,
              isStreamChunk: true,
            });
          });
          if (genId === currentGenId && merged.length > 0) {
            cardAudioChunks.set(index, [{ samples: merged, sampleRate: sr }]);
            return;
          }
        } catch (err) {
          if (err?.name === "AbortError") return;
          console.warn("[LFM3-Omni] Pure TTS fallback to Kokoro-82M:", err);
        }
      }

      // Fallback / Lightweight path: Kokoro-82M-v1.0-ONNX (q8 WASM)
      if (!ttsReady) {
        ttsLoadingCardId = index;
        if (currentSpec) jsonRender(currentSpec, root);
      }
      await initTTSPreload();
      if (ttsLoadingCardId === index) {
        ttsLoadingCardId = -1;
        if (currentSpec) jsonRender(currentSpec, root);
      }
      if (genId !== currentGenId || !ttsReady) return;

      const clauses = splitIntoClauses(text);
      for (let cIdx = 0; cIdx < clauses.length; cIdx++) {
        if (genId !== currentGenId) return;
        const clause = clauses[cIdx];
        const isLastClause = cIdx === clauses.length - 1;
        try {
          const res = await ttsClient.run("text-to-speech", clause, {
            voice: "af_heart",
            speed: 1.0,
          });
          if (genId !== currentGenId || !res || res.aborted) return;
          if (res.audio && res.audio.length > 0) {
            const raw =
              res.audio instanceof Float32Array ? res.audio : new Float32Array(res.audio);
            const samples = normalizeAudioSamples(raw);
            const sampleRate = res.sampling_rate || 24000;
            cacheAudioChunk(index, { samples, sampleRate });
            enqueueAudio({
              genId,
              index,
              text: clause,
              samples,
              sampleRate,
              isLastClause,
            });
          }
        } catch (err) {
          console.error("Kokoro-82M TTS error:", err);
        }
      }
    }

    function replayFromCard(startId) {
      unlockAudioOnUserGesture();
      stopAllAudio();
      interruptLfm3Turn();
      interruptClientIfActive(ttsClient);
      completedPasses = 0;
      if (!currentSpec) return;

      const nodes = (currentSpec.children || []).filter(
        (c) => typeof c.props.id === "number" && c.props.id >= startId
      );
      for (const node of nodes) {
        const idx = node.props.id;
        const chunks = cardAudioChunks.get(idx);
        if (chunks && chunks.length > 0) {
          chunks.forEach((ch, cIdx) => {
            enqueueAudio({
              genId: currentGenId,
              index: idx,
              text: node.props.text,
              samples: ch.samples,
              sampleRate: ch.sampleRate,
              isLastClause: cIdx === chunks.length - 1,
            });
          });
        } else {
          synthesizeAndStreamCard(currentGenId, idx, node.props.text);
        }
      }
    }

    async function runPrecookedSample(genId, sampleKey, targetCount) {
      const sample = PRECOOKED_SCENARIOS[sampleKey];
      if (!sample) return;

      const count = Math.max(1, Math.min(10, targetCount || selectedCardCount));
      const items = sample.affirmations.slice(0, count);
      const streamedTexts = items.map(() => "");

      synthesizeAndStreamCard(genId, 0, items[0].text, items[0].audioUrl);

      for (let i = 0; i < items.length; i++) {
        if (genId !== currentGenId) return;
        if (i > 0) {
          synthesizeAndStreamCard(genId, i, items[i].text, items[i].audioUrl);
        }

        const words = items[i].text.split(" ");
        for (let w = 0; w < words.length; w++) {
          if (genId !== currentGenId) return;
          streamedTexts[i] = words.slice(0, w + 1).join(" ");
          const children = [];
          for (let k = 0; k <= i; k++) {
            children.push({
              component: "AffirmationCard",
              props: {
                id: k,
                index: k + 1,
                text: streamedTexts[k],
                science: items[k].science,
                status: k < i || w === words.length - 1 ? "complete" : "streaming",
              },
            });
          }
          jsonRender(
            {
              component: "CardStream",
              props: { scenario: sample.query, count: items.length },
              children,
            },
            root
          );
          await new Promise((r) => setTimeout(r, 26));
        }
      }

      if (genId === currentGenId) {
        generationComplete = true;
      }
    }

    function cleanAffirmationText(raw) {
      return raw
        .replace(/^\s*[\d]+[\.\)\-\:]\s*/, "")
        .replace(/^[-*•]\s*/, "")
        .replace(/^["'“”‘’*]+|["'“”‘’*]+$/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function isUniqueEnough(candidate, existingList) {
      const norm = (s) =>
        s
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, "")
          .split(/\s+/)
          .filter((w) => w.length > 2);
      const candWords = new Set(norm(candidate));
      if (candWords.size < 4) return false;
      for (const prev of existingList) {
        const prevWords = new Set(norm(prev));
        let overlap = 0;
        for (const w of candWords) {
          if (prevWords.has(w)) overlap++;
        }
        const union = new Set([...candWords, ...prevWords]).size;
        if (union > 0 && overlap / union > 0.45) {
          return false;
        }
      }
      return true;
    }

    function parseScenarioAndCount(rawQuery) {
      let count = selectedCardCount;
      let scenario = rawQuery.trim();
      const lead = scenario.match(/^(\d{1,2})\s+(?:affirmations?\s+(?:for|on|about|to)\s+)?(.+)$/i);
      const trail = scenario.match(/^(.+?)[,\s]+(\d{1,2})\s*(?:affirmations?)?$/i);
      if (lead) {
        count = Math.max(1, Math.min(10, parseInt(lead[1], 10)));
        scenario = lead[2].trim();
        selectedCardCount = count;
        updateCountUI();
      } else if (trail) {
        scenario = trail[1].trim();
        count = Math.max(1, Math.min(10, parseInt(trail[2], 10)));
        selectedCardCount = count;
        updateCountUI();
      }
      return { scenario, count: Math.max(1, Math.min(10, count)) };
    }

    function initTTSPreload() {
      if (ttsReady) return Promise.resolve();
      if (ttsLoadPromise) return ttsLoadPromise;
      ttsLoadPromise = ttsClient
        .load({
          task: "text-to-speech",
          modelId: TTS_MODEL_ID,
          dtype: "q8",
          device: "wasm",
          onProgress: (ev) => {
            if (!ttsReady && ev && ev.status === "downloading") {
              ttsLoadingPercent = typeof ev.percent === "number" ? ev.percent : null;
              if (ttsLoadingCardId >= 0 && currentSpec) {
                jsonRender(currentSpec, root);
              }
            }
          },
        })
        .then(() => {
          ttsReady = true;
          ttsLoadingPercent = null;
        })
        .catch((err) => {
          console.warn("[Kokoro-82M] TTS preload failed, will retry on next request:", err);
          ttsLoadPromise = null;
          ttsLoadingPercent = null;
        });
      return ttsLoadPromise;
    }

    function initLLMPreload() {
      if (llmLoadPromise) return llmLoadPromise;
      const loadCtrl = new AbortController();
      llmLoadAbortController = loadCtrl;

      llmLoadPromise = (async () => {
        if (!localfirstTelemetry) {
          await probeHardwareAndSelectModel();
        }

        // Build fallback order starting from the localfirst-selected tier down to SmolLM2-135M (92MB)
        const startIdx = LIGHTWEIGHT_MODEL_TIERS.findIndex(
          (t) => t.key === selectedModelTier.key
        );
        const fallbackOrder = [
          selectedModelTier,
          ...LIGHTWEIGHT_MODEL_TIERS.slice(0, Math.max(0, startIdx)).reverse(),
        ];

        for (const candidate of fallbackOrder) {
          if (loadCtrl.signal.aborted) return;
          try {
            selectedModelTier = candidate;
            updateDeviceBadgeUI("loading", 0);

            if (candidate.engine === "lfm3-omni") {
              if (lfm3Model && lfm3Session && !lfm3Model.lost) {
                llmReady = true;
                ttsReady = true;
                updateDeviceBadgeUI("ready");
                return;
              }
              // Free any ONNX WASM workers first so mobile/low-memory GPUs have maximum headroom
              releaseLlmWorker();
              releaseTtsWorker();

              const { Lfm3OmniForConditionalGeneration } = await getLfm3Module();
              const avail = await Lfm3OmniForConditionalGeneration.checkAvailability(
                candidate.modelId
              );
              if (!avail?.ok) {
                throw new Error(avail?.reason || "WebGPU adapter unsupported for LFM3-Omni-2B");
              }

              const compactMobileContext = isHandsetOrTabletPlatform() || (navigator.deviceMemory && navigator.deviceMemory <= 8);
              lfm3Model = await Lfm3OmniForConditionalGeneration.from_pretrained(
                candidate.modelId,
                {
                  signal: loadCtrl.signal,
                  maxLength: compactMobileContext ? 512 : 2048,
                  ...(compactMobileContext ? { decodePipelineDepth: 1 } : {}),
                  onProgress: (ev) => {
                    if (loadCtrl.signal.aborted || llmReady) return;
                    let pct = null;
                    let detail = "";
                    if (ev.kind === "bytes" && ev.total > 0) {
                      pct = Math.min(99, Math.round((ev.loaded / ev.total) * 100));
                      const loadedMB = (ev.loaded / 1048576).toFixed(0);
                      const totalMB = (ev.total / 1048576).toFixed(0);
                      detail = ` · ${loadedMB}/${totalMB} MB`;
                    } else if (typeof ev.fraction === "number") {
                      pct = Math.min(99, Math.round(ev.fraction * 100));
                      if (ev.message) detail = ` · ${ev.message}`;
                    }
                    updateDeviceBadgeUI("loading", pct);
                    if (currentGenId > 0 && !activeSampleKey) {
                      jsonRender(
                        {
                          component: "CardStream",
                          children: [
                            {
                              component: "AffirmationCard",
                              props: {
                                id: "warmup",
                                index: "··",
                                text: `Loading ${candidate.shortName} (${candidate.sizeLabel}) unified Text + 24kHz Speech on WebGPU (${pct ?? 0}%${detail})...`,
                                science: `LOCALFIRST · ${candidate.tierName.toUpperCase()}`,
                                status: "streaming",
                              },
                            },
                          ],
                        },
                        root
                      );
                    }
                  },
                }
              );

              lfm3Session = lfm3Model.create_session();
              llmReady = true;
              ttsReady = true;
              updateDeviceBadgeUI("ready");
              return;
            }

            // On handsets/tablets, ensure TTS WASM worker is released before loading LLM WASM worker
            // so two ONNX WASM linear memory arenas NEVER coexist in iOS WKWebView/Safari RAM.
            if (isHandsetOrTabletPlatform()) {
              releaseTtsWorker();
            }

            // Lightweight ONNX fallback tier via webml-kit (+ Kokoro-82M TTS)
            await llmClient.load({
              task: "text-generation",
              modelId: candidate.modelId,
              device: selectedBackend,
              dtype: candidate.dtype,
              onProgress: (ev) => {
                if (loadCtrl.signal.aborted) return;
                if (!llmReady && ev.status === "downloading") {
                  updateDeviceBadgeUI("loading", ev.percent || 0);
                  if (currentGenId > 0 && !activeSampleKey) {
                    const loadedMB = ((ev.loaded || 0) / 1048576).toFixed(1);
                    const totalMB = ev.total
                      ? ((ev.total || 0) / 1048576).toFixed(1)
                      : candidate.sizeMB;
                    jsonRender(
                      {
                        component: "CardStream",
                        children: [
                          {
                            component: "AffirmationCard",
                            props: {
                              id: "warmup",
                              index: "··",
                              text: `Loading ${candidate.shortName} (${candidate.sizeLabel}) via localfirst + webml-kit (${ev.percent || 0}% · ${loadedMB}/${totalMB} MB)...`,
                              science: `LOCALFIRST · ${candidate.tierName.toUpperCase()}`,
                              status: "streaming",
                            },
                          },
                        ],
                      },
                      root
                    );
                  }
                }
              },
            });

            llmReady = true;
            updateDeviceBadgeUI("ready");
            if (!isMobileDevice) {
              initTTSPreload();
            }
            return;
          } catch (err) {
            if (loadCtrl.signal.aborted || err?.name === "AbortError") {
              return;
            }
            console.warn(
              `[localfirst] ${candidate.shortName} failed on ${selectedBackend}, falling back to lighter model:`,
              err
            );
            if (candidate.engine !== "lfm3-omni") {
              selectedBackend = "wasm";
            }
          }
        }
      })();
      return llmLoadPromise;
    }

    async function runScenarioGeneration(genId, rawQuery) {
      const { scenario, count } = parseScenarioAndCount(rawQuery);
      if (!scenario) return;

      const normalizedQuery = scenario.toLowerCase();
      for (const [key, sample] of Object.entries(PRECOOKED_SCENARIOS)) {
        if (normalizedQuery === sample.query.toLowerCase()) {
          activeSampleKey = key;
          await runPrecookedSample(genId, key, count);
          return;
        }
      }

      await initLLMPreload();
      if (genId !== currentGenId) return;

      const finalizedCards = [];
      const fallbackTemplates = [
        `I narrow my attention to the single next verifiable step in ${scenario}.`,
        `The physical alertness I feel during ${scenario} is fuel sharpening my clarity.`,
        `My steadiness in ${scenario} comes from my preparation and values, not external noise.`,
        `I observe urgency around ${scenario} as data, never as a reason to rush my judgment.`,
        `With one slow exhale, my nervous system settles so I can navigate ${scenario} deliberately.`,
        `Every obstacle inside ${scenario} gives me diagnostic feedback that refines my approach.`,
        `I protect unfragmented focus while working through ${scenario} one layer at a time.`,
        `I speak to myself with objective calm and precision throughout ${scenario}.`,
        `I separate what I can control right now in ${scenario} from what can wait.`,
        `Steady, methodical progress in ${scenario} is enough for this moment.`,
      ];

      const renderLiveState = (streamingText = null, streamingLens = null) => {
        if (genId !== currentGenId) return;
        const children = finalizedCards.map((item, idx) => ({
          component: "AffirmationCard",
          props: {
            id: idx,
            index: idx + 1,
            text: item.text,
            science: item.science,
            status: "complete",
          },
        }));

        if (streamingText && children.length < count) {
          const nextIdx = children.length;
          children.push({
            component: "AffirmationCard",
            props: {
              id: nextIdx,
              index: nextIdx + 1,
              text: streamingText,
              science: streamingLens,
              status: "streaming",
            },
          });
        }

        jsonRender(
          {
            component: "CardStream",
            props: { scenario, count },
            children,
          },
          root
        );
      };

      try {
        for (let cardIdx = 0; cardIdx < count; cardIdx++) {
          if (genId !== currentGenId) return;
          const lens = SCIENCE_LENSES[cardIdx % SCIENCE_LENSES.length];
          const avoidClause =
            finalizedCards.length > 0
              ? `\nDo NOT repeat these words or ideas:\n- ${finalizedCards
                  .slice(-3)
                  .map((c) => c.text)
                  .join("\n- ")}`
              : "";

          // Unified Flagship Path: Liquid AI LFM3-Omni-2B interleaved Text + 24kHz Speech on WebGPU
          if (selectedModelTier.engine === "lfm3-omni" && lfm3Session && !lfm3Model?.lost) {
            try {
              const omniMessages = [
                {
                  role: "system",
                  content:
                    "You write one single, evidence-based, first-person affirmation grounded in behavioral neuroscience and cognitive psychology.\n" +
                    "Rules:\n" +
                    "- Output ONLY one single sentence (12 to 20 words) in first person ('I...' or 'My...' or 'With each...').\n" +
                    "- Never use toxic positivity, clichés, or vague wishes.\n" +
                    "- Do not include numbers, quotes, or extra commentary.\n" +
                    "Respond with interleaved text and audio.",
                },
                {
                  role: "user",
                  content:
                    `Situation: "${scenario}"\n` +
                    `Scientific lens (${lens.tag}): ${lens.cue}${avoidClause}\n` +
                    `Write 1 specific first-person sentence for this lens:`,
                },
              ];

              const sr = lfm3Model.audio_sampling_rate || 24000;
              let rawCardText = "";
              const omniAudioChunks = [];

              await withLfm3TurnLock(async () => {
                if (genId !== currentGenId) return;
                const turnCtrl = new AbortController();
                lfm3TurnAbortController = turnCtrl;
                try {
                  // Note: Do NOT pass do_sample: true for interleaved speech output;
                  // LFM3-Omni greedily decodes text while its depth decoder samples 24kHz speech.
                  const stream = lfm3Session.generate(omniMessages, {
                    generation_mode: "interleaved",
                    max_new_tokens: 240,
                    signal: turnCtrl.signal,
                  });

                  for await (const ev of stream) {
                    if (genId !== currentGenId) {
                      turnCtrl.abort();
                      break;
                    }
                    if (ev.type === "text" && ev.text) {
                      rawCardText += ev.text;
                      const firstLine = cleanAffirmationText(rawCardText.split(/\r?\n/)[0] || "");
                      const firstSentence = (firstLine.match(/^[^.!?]+[.!?]?/) || [
                        firstLine,
                      ])[0].trim();
                      if (firstSentence) {
                        renderLiveState(firstSentence, lens.tag);
                      }
                    } else if (ev.type === "audio" && ev.audio && ev.audio.length > 0) {
                      const pcm = new Float32Array(ev.audio);
                      omniAudioChunks.push(pcm);
                      enqueueAudio({
                        genId,
                        index: cardIdx,
                        text: rawCardText,
                        samples: pcm,
                        sampleRate: sr,
                        isStreamChunk: true,
                      });
                    }
                  }
                } finally {
                  if (lfm3TurnAbortController === turnCtrl) {
                    lfm3TurnAbortController = null;
                  }
                }
              });

              if (genId !== currentGenId) return;

              const rawLine = cleanAffirmationText(rawCardText.split(/\r?\n/)[0] || "");
              let finalSentence = (rawLine.match(/^[^.!?]+[.!?]?/) || [rawLine])[0].trim();
              if (finalSentence && !/[.!?]$/.test(finalSentence)) {
                finalSentence += ".";
              }

              let usedFallbackSentence = false;
              if (
                !finalSentence ||
                !isUniqueEnough(
                  finalSentence,
                  finalizedCards.map((c) => c.text)
                )
              ) {
                finalSentence = fallbackTemplates[cardIdx % fallbackTemplates.length];
                usedFallbackSentence = true;
              }

              finalizedCards.push({ text: finalSentence, science: lens.tag });
              renderLiveState(null, null);

              if (!usedFallbackSentence && omniAudioChunks.length > 0) {
                const merged = normalizeAudioSamples(mergeFloat32Chunks(omniAudioChunks));
                cardAudioChunks.set(cardIdx, [{ samples: merged, sampleRate: sr }]);
              } else {
                synthesizeAndStreamCard(genId, cardIdx, finalSentence);
              }
              continue;
            } catch (omniErr) {
              if (omniErr?.name === "AbortError" || genId !== currentGenId) return;
              console.warn(
                "[localfirst] LFM3-Omni runtime error, seamlessly falling back to lightweight ONNX + Kokoro-82M:",
                omniErr
              );
              lfm3Model = null;
              lfm3Session = null;
              llmReady = false;
              llmLoadPromise = null;
              selectedModelTier = isMobileDevice
                ? LIGHTWEIGHT_MODEL_TIERS[0]
                : LIGHTWEIGHT_MODEL_TIERS[2];
              await initLLMPreload();
              if (genId !== currentGenId) return;
            }
          }

          // Lightweight / Mobile Fallback Path: Qwen2.5-0.5B or SmolLM2-135M/360M + Kokoro-82M TTS
          const messages = [
            {
              role: "system",
              content:
                "You write one single, evidence-based, first-person affirmation grounded in behavioral neuroscience and cognitive psychology.\n" +
                "Rules:\n" +
                "- Output ONLY one single sentence (12 to 20 words) in first person ('I...' or 'My...' or 'With each...').\n" +
                "- Never use toxic positivity, clichés, or vague wishes.\n" +
                "- Do not include numbers, quotes, or extra commentary.",
            },
            {
              role: "user",
              content:
                `Situation: "${scenario}"\n` +
                `Scientific lens (${lens.tag}): ${lens.cue}${avoidClause}\n` +
                `Write 1 specific first-person sentence for this lens:`,
            },
          ];

          let rawCardText = "";
          const tokenStream = llmClient.stream(messages, {
            maxNewTokens: 28,
            doSample: false,
          });

          for await (const { token } of tokenStream) {
            if (genId !== currentGenId) return;
            rawCardText += token;
            const firstLine = cleanAffirmationText(rawCardText.split(/\r?\n/)[0] || "");
            const firstSentence = (firstLine.match(/^[^.!?]+[.!?]?/) || [firstLine])[0].trim();
            if (firstSentence) {
              renderLiveState(firstSentence, lens.tag);
            }
          }

          if (genId !== currentGenId) return;
          const rawLine = cleanAffirmationText(rawCardText.split(/\r?\n/)[0] || "");
          let finalSentence = (rawLine.match(/^[^.!?]+[.!?]?/) || [rawLine])[0].trim();
          if (finalSentence && !/[.!?]$/.test(finalSentence)) {
            finalSentence += ".";
          }

          if (!finalSentence || !isUniqueEnough(finalSentence, finalizedCards.map((c) => c.text))) {
            finalSentence = fallbackTemplates[cardIdx % fallbackTemplates.length];
          }

          finalizedCards.push({ text: finalSentence, science: lens.tag });
          renderLiveState(null, null);

          // Desktop streams TTS in parallel per card; mobile defers TTS until LLM worker is freed
          if (!isHandsetOrTabletPlatform()) {
            synthesizeAndStreamCard(genId, cardIdx, finalSentence);
          }
        }

        // Mobile / iPhone Chrome strict single-worker phase:
        // Terminate SmolLM2 WASM worker BEFORE spawning Kokoro-82M WASM worker (~450MB max peak vs ~1.15GB)
        if (
          genId === currentGenId &&
          isHandsetOrTabletPlatform() &&
          selectedModelTier.engine !== "lfm3-omni"
        ) {
          releaseLlmWorker();
          await new Promise((r) => setTimeout(r, 40));
          for (let i = 0; i < finalizedCards.length; i++) {
            if (genId !== currentGenId) return;
            await synthesizeAndStreamCard(genId, i, finalizedCards[i].text);
          }
          if (genId === currentGenId) {
            releaseTtsWorker();
          }
        }

        if (genId === currentGenId) {
          generationComplete = true;
        }
      } catch (err) {
        if (genId === currentGenId) {
          console.error("localfirst generation error:", err);
        }
      }
    }

    function startScenario(query, sampleKey = null) {
      currentGenId += 1;
      const genId = currentGenId;
      generationComplete = false;
      completedPasses = 0;
      ttsLoadingCardId = -1;
      activeSampleKey = sampleKey;

      stopAllAudio();
      unlockAudioOnUserGesture();

      interruptLfm3Turn();
      interruptClientIfActive(llmClient);
      interruptClientIfActive(ttsClient);

      cardAudioChunks.clear();
      currentSpec = null;
      root.innerHTML = "";

      document.querySelectorAll(".sample-chip").forEach((chip) => {
        chip.classList.toggle("active", chip.dataset.sample === sampleKey);
      });

      if (sampleKey && PRECOOKED_SCENARIOS[sampleKey]) {
        runPrecookedSample(genId, sampleKey, selectedCardCount);
        return;
      }

      jsonRender(
        {
          component: "CardStream",
          children: [
            {
              component: "AffirmationCard",
              props: {
                id: "warmup",
                index: "··",
                text: llmReady
                  ? `Streaming ${selectedCardCount} science-backed affirmations via ${selectedModelTier.shortName}...`
                  : `Warming up ${selectedModelTier.shortName} (${selectedModelTier.sizeLabel}) via localfirst...`,
                science: `LOCALFIRST · ${selectedModelTier.tierName.toUpperCase()}`,
                status: "streaming",
              },
            },
          ],
        },
        root
      );

      runScenarioGeneration(genId, query);
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;
      startScenario(query, null);
    });

    document.querySelectorAll(".sample-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const key = chip.dataset.sample;
        const sample = PRECOOKED_SCENARIOS[key];
        if (!sample) return;
        input.value = sample.query;
        startScenario(sample.query, key);
      });
    });

    // Startup: Probe hardware via @ondevice/localfirst detect(), Lfm3Omni.checkAvailability(), & browser-llm-fit fit()
    // On desktop, preload LFM3-Omni-2B (or ONNX fallback + Kokoro-82M) in background.
    // On mobile / iPhone Chrome (WKWebView ~1GB Jetsam limit), keep 0 workers resident at startup
    // (~25MB total page RAM; presets play 24kHz WAVs instantly, and custom prompts lazy-load one worker at a time).
    (async () => {
      await probeHardwareAndSelectModel();
      if (!isHandsetOrTabletPlatform()) {
        await initLLMPreload();
        if (selectedModelTier.engine !== "lfm3-omni") {
          initTTSPreload();
        }
      }
    })();
  </script>
</body>
</html>
